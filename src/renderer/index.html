<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"
  />
  <title>LM SuperApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../node_modules/katex/dist/katex.min.css" />
  <script src="../../node_modules/katex/dist/katex.min.js"></script>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/home.css" />
  <link rel="stylesheet" href="styles/models.css" />
  <link rel="stylesheet" href="styles/chat.css" />
  <link rel="stylesheet" href="styles/library.css" />
  <link rel="stylesheet" href="styles/settings.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-name">LM SuperApp</span>
      </div>

      <nav class="nav" aria-label="Primary">
        <button class="nav-item is-active" data-tab="home" type="button">
          <span data-ico="home"></span>
          <span class="nav-text">Home</span>
        </button>
        <button class="nav-item" data-tab="models" type="button">
          <span data-ico="models"></span>
          <span class="nav-text">Models</span>
        </button>
        <button class="nav-item" data-tab="chat" type="button">
          <span data-ico="chat"></span>
          <span class="nav-text">Chat</span>
        </button>
        <button class="nav-item" data-tab="library" type="button">
          <span data-ico="library"></span>
          <span class="nav-text">Library</span>
        </button>
        <div class="nav-more" id="nav-more">
          <button class="nav-item" id="nav-more-btn" type="button" aria-label="More tabs" title="More">
            <span data-ico="more"></span>
            <span class="nav-text">More</span>
          </button>
          <div class="nav-more-menu" id="nav-more-menu">
            <button class="nav-item" data-tab="finetune" type="button">
              <span data-ico="finetune"></span>
              <span class="nav-text">Finetune</span>
            </button>
            <button class="nav-item" data-tab="export" type="button">
              <span data-ico="export"></span>
              <span class="nav-text">Export</span>
            </button>
          </div>
        </div>
      </nav>

      <button class="side-chat side-new" id="side-new-chat" type="button">
        <span data-ico="more"></span>
        <span class="side-chat-title">New chat</span>
      </button>
      <nav class="side-chats" id="side-chats" aria-label="Conversations"></nav>

      <footer class="sidebar-foot">
        <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings" title="Settings">
          <span data-ico="settings"></span>
        </button>
        <span class="foot-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="app-info">Ready</span>
        </span>
      </footer>
    </aside>

    <main class="content">
      <section class="tab is-visible" id="tab-home"></section>
      <section class="tab" id="tab-models"></section>
      <section class="tab" id="tab-chat"></section>
      <section class="tab" id="tab-library"></section>
      <section class="tab" id="tab-finetune"></section>
      <section class="tab" id="tab-export"></section>
      <section class="tab" id="tab-settings"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
